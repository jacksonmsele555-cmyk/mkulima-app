<!DOCTYPE html>
<html lang="sw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasiliana Nasi - Mkulima App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            background: #0d1117;
            color: white;
            font-family: 'Poppins', sans-serif;
        }
        
        .card-form {
            background: rgba(22, 27, 34, 0.8);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #30363d;
            max-width: 500px;
            margin: 60px auto;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .wa-icon {
            font-size: 4rem;
            color: #25D366;
            /* Rangi halisi ya WhatsApp */
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(37, 211, 102, 0.4));
        }
        
        input,
        textarea {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            background: #0d1117;
            border: 1px solid #30363d;
            color: white;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        
        input:focus,
        textarea:focus {
            border-color: #25D366;
            outline: none;
            box-shadow: 0 0 10px rgba(37, 211, 102, 0.2);
        }
        
        label {
            display: block;
            text-align: left;
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: -10px;
            margin-left: 5px;
        }
        
        .btn-whatsapp {
            background: #25D366;
            color: white;
            width: 100%;
            padding: 16px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 10px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
            margin-top: 10px;
        }
        
        .btn-whatsapp:hover {
            background: #128C7E;
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(37, 211, 102, 0.4);
        }
        
        .info-text {
            color: #8b949e;
            font-size: 0.9rem;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="logo">MKULIMA APP</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="form.html">Sajili Zao</a></li>
            <li><a href="contact.html" style="color: #39FF14;">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="card-form">
            <div class="wa-icon">
                <i class="fab fa-whatsapp"></i>
            </div>
            <h2 style="color: #39FF14; margin-bottom: 10px;">Wasiliana Nasi</h2>
            <p class="info-text">Tuna masaa 24 ya kukusaidia. Jaza fomu hii utumie ujumbe moja kwa moja WhatsApp.</p>

            <form id="whatsappForm">
                <label>Jina Lako:</label>
                <input type="text" id="wa_name" placeholder="Mfano: Juma Shambani" required>

                <label>Ujumbe Wako:</label>
                <textarea id="wa_msg" placeholder="Andika hitaji lako hapa..." required></textarea>

                <button type="button" class="btn-whatsapp" onclick="sendToWhatsApp()">
                    <i class="fab fa-whatsapp"></i> TUMA WHATSAPP
                </button>
            </form>

            <p style="margin-top: 25px; font-size: 0.8rem; color: #58a6ff;">
                <i class="fas fa-lock"></i> Maongezi yako ni ya siri na salama.
            </p>
        </div>
    </div>

    <script>
        function sendToWhatsApp() {
            // Namba yako ya WhatsApp (Imeanza na 255)
            const nambaYaSimu = "255780777380";

            const jina = document.getElementById('wa_name').value;
            const ujumbe = document.getElementById('wa_msg').value;

            if (jina.trim() === "" || ujumbe.trim() === "") {
                alert("Tafadhali jaza jina na ujumbe kabla ya kutuma!");
                return;
            }

            // Tengeneza muundo mzuri wa ujumbe
            const maandishi = `*MKULIMA APP - MAWASILIANO*\n\n*Jina:* ${jina}\n*Ujumbe:* ${ujumbe}`;

            // Link ya WhatsApp
            const url = `https://wa.me/${nambaYaSimu}?text=${encodeURIComponent(maandishi)}`;

            // Fungua WhatsApp
            window.open(url, '_blank').focus();
        }
    </script>
</body>

</html>
